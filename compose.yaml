services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      APP_UPSTREAM: ${APP_UPSTREAM}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - oauth2-proxy
    networks:
      - webnet

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    environment:
      # OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://${SAP_IAS_TENANT}.ondemand.com
      OAUTH2_PROXY_CLIENT_ID: ${CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${CLIENT_SECRET}
      OAUTH2_PROXY_SCOPE: "openid email profile"
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: email
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      # OAUTH2_PROXY_COOKIE_DOMAINS: ${DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${DOMAIN}
      OAUTH2_PROXY_REDIRECT_URL: "https://${DOMAIN}/oauth2/callback"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_GITHUB_ORG: ${GITHUB_ORG:-}
      OAUTH2_PROXY_GITHUB_TEAM: ${GITHUB_TEAM:-}
      OAUTH2_PROXY_GITHUB_USERS: ${GITHUB_USERS:-}
    networks:
      - webnet

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
      POSTGRES_DB: workbench
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - webnet


  
  app-server:
    image: hapejot/pjl-runtime:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      #AUTH_USER_HEADER: X-Auth-Request-User
      AUTH_USER_HEADER: X-Auth-Request-Email 
      AUTH_REQUIRED: true
      DDIC: /app/model/ddic.json
      SCRIPTS_DIR: /app/scripts
      STORE_PG_URL: postgres://workbench:${DB_PASSWORD}@db/workbench
      PORT: "8080"
      RUST_LOG: info
    ports:
      - "127.0.0.1:3270:3270"
    volumes:
      - ./ddic.json:/app/model/ddic.json:ro
      - ./scripts:/app/scripts:ro
    restart: unless-stopped
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  db:
